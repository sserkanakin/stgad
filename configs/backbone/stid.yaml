# STID hyperparameters (same for both datasets; num_nodes overridden per dataset)
input_len: 12
output_len: 12
input_dim: 1
embed_dim: 32
output_dim: 1
num_layer: 3
if_spatial: true
if_time_in_day: true
if_day_in_week: true
time_of_day_size: 288
day_of_week_size: 7

# Training
lr: 1.0e-3
batch_size: 64
epochs: 100
