[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-diffusion"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.2",
    "numpy",
    "scipy",
    "pandas<2.3",  # 2.3+ dropped Python 3.9 wheels; DAIC's default python is 3.9
    "h5py",
    "pyyaml",
    "wandb",
    "properscoring",
    "tqdm",
    "matplotlib",
    "einops",
    "tables",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyter",
    "ipykernel",
    "black",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
