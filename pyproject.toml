[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-diffusion"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    # pin the numeric stack to the versions the DAIC module used to ship (numpy
    # 1.26 / scipy 1.14 / pandas 2.2). now that these come from pip (not the
    # py-torch module) an unpinned install pulls numpy 2 / pandas 3, whose
    # breaking changes could silently alter results mid-study. keep them frozen.
    "numpy<2",
    "scipy<1.15",
    "pandas<3",
    "h5py",
    "pyyaml",
    "wandb",
    "properscoring",
    "tqdm",
    "matplotlib",
    "einops",
    "easydict",   # required by the vendored DiffSTG UGnet (src/diffusion/denoiser.py)
]

[project.optional-dependencies]
# pytables (PyPI name "tables") is only used by scripts/preprocess.py and
# scripts/diagnose_temporal_acf.py to read pandas-HDFStore .h5 files. Both
# scripts run once on a developer machine to produce .npz files; everything
# downstream uses the .npz files. Optional install via:
#   pip install -e ".[hdf]"
# On DAIC we don't need this — extract `pd.read_hdf` reads happen locally.
hdf = [
    "tables",
]

# interactive residual/graph/diagnostic dashboard (scripts/analysis/dashboard.py).
# local-dev only; never needed on DAIC. install via:  pip install -e ".[viz]"
viz = [
    "streamlit",
    "plotly",
]

dev = [
    "pytest",
    "jupyter",
    "ipykernel",
    "black",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
