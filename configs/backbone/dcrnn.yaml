# DCRNN (PyTorch) hyperparameters — num_nodes overridden per dataset
input_dim: 2          # speed + time_of_day
output_dim: 1         # speed only
seq_len: 12
horizon: 12
hidden_state_size: 64
num_rnn_layers: 2
filter_type: dual_random_walk
max_diffusion_step: 2

# Training
lr: 1.0e-3
batch_size: 64
epochs: 100
