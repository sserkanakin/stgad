dataset: pems08f
num_nodes: 170
raw_npz: data/raw/pems08/PEMS08.npz
adj_csv: data/raw/pems08/PEMS08.csv
channel: 0          # 0 = flow (vehicles/5min), 1 = occupancy, 2 = speed
graph_type: binary  # connectivity adjacency from CSV (not Gaussian)
t_in: 12
t_out: 12
stride: 1
split_train: 0.6
split_val: 0.8      # cumulative (0.6 train, 0.2 val, 0.2 test)
tod_size: 288       # 5-min slots per day; synthesised from sample index (no timestamps in npz)
